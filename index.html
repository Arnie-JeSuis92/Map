<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">

<link rel="stylesheet" href="./resources/ol.css">
<link rel="stylesheet" href="resources/fontawesome-all.min.css">
<link rel="stylesheet" href="./resources/ol-layerswitcher.css">
<link rel="stylesheet" href="./resources/qgis2web.css">

<style>
html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

.ol-control > * {
    background-color: #f8f8f8 !important;
    color: #444 !important;
}
</style>

<title>Map</title>
</head>

<body>

<div id="map"></div>

<!-- INFO BOX -->
<div id="country-info" style="
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(255,255,255,0.9);
    padding: 10px;
    border-radius: 6px;
    font-family: Arial;
    font-size: 14px;
    z-index: 9999;
    display: none;
"></div>

<div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
    <div id="popup-content"></div>
</div>
    
<!-- CLOCK -->
<div id="clock" style="
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,0.8);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: Arial;
    z-index: 9999;
"></div>

<script src="resources/qgis2web_expressions.js"></script>
<script src="resources/functions.js"></script>
<script src="./resources/ol.js"></script>
<script src="resources/ol-layerswitcher.js"></script>

<script src="layers/WorldMap_1.js"></script>
<script src="layers/Punkt_3.js"></script>
    
<script src="styles/WorldMap_1_style.js"></script>
<script src="layers/Punkt_3_style.js"></script>

<script src="./layers/layers.js"></script>

<script src="resources/Autolinker.min.js"></script>
<script src="./resources/qgis2web.js"></script>

<script>
console.log("WorldMap loaded:", typeof json_WorldMap_1);
</script>


<script>
/* ---------------- CLOCK ---------------- */
function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerHTML =
        now.toLocaleTimeString();
}
updateClock();
setInterval(updateClock, 1000);

/* ---------------- HOVER HIGHLIGHT ---------------- */

<div id="country-info"></div>
const infoBox = document.getElementById('country-info');

const highlightStyle = new ol.style.Style({
    stroke: new ol.style.Stroke({
        color: '#ffff00',
        width: 3
    }),
    fill: new ol.style.Fill({
        color: 'rgba(255,255,0,0.25)'
    })
});

let lastFeature = null;
let originalStyle = null;

map.on('pointermove', function (evt) {

    if (lastFeature) {
        lastFeature.setStyle(originalStyle);
        lastFeature = null;
    }

    const feature = map.forEachFeatureAtPixel(evt.pixel, function (f, layer) {
        return { feature: f, layer: layer };
    });

    if (!feature) {
        infoBox.style.display = "none";
        map.getTargetElement().style.cursor = "";
        return;
    }

    const f = feature.feature;
    const layer = feature.layer;

    lastFeature = f;
    originalStyle = f.getStyle();

    f.setStyle(highlightStyle);

    let label = "Unknown";

    /* ---------------- LAYER DETECTION ---------------- */

    if (layer) {
        const layerName = layer.get('title') || layer.get('name') || '';

        if (layerName.toLowerCase().includes("osm")) {
            label = "OpenStreetMap feature";
        }
        else if (layerName.toLowerCase().includes("ocean") ||
                 layerName.toLowerCase().includes("depth") ||
                 layerName.toLowerCase().includes("bathym")) {
            label = "Ocean depth / bathymetry";
        }
        else if (layerName.toLowerCase().includes("worldmap") ||
                 layerName.toLowerCase().includes("country")) {
            label = "Country / Land area";
        }
        else if (layerName.toLowerCase().includes("coast")) {
            label = "Coastline";
        }
        else {
            label = "Map feature";
        }
    }

    /* ---------------- GEOMETRY FALLBACK ---------------- */

    const geom = f.getGeometry().getType();

infoBox.innerHTML =
    "<b>" + label + "</b><br>" +
    "Geometry: " + geom;

    infoBox.style.display = "block";
    map.getTargetElement().style.cursor = "pointer";

});

</script>

</body>
</html>
