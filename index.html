<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">

<link rel="stylesheet" href="./resources/ol.css">
<link rel="stylesheet" href="resources/fontawesome-all.min.css">
<link rel="stylesheet" href="./resources/ol-layerswitcher.css">
<link rel="stylesheet" href="./resources/qgis2web.css">

<style>
html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

.ol-control > * {
    background-color: #f8f8f8 !important;
    color: #444 !important;
}
</style>

<title>Map</title>
</head>

<body>

<div id="map"></div>

<!-- INFO BOX -->
<div id="country-info" style="
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(255,255,255,0.9);
    padding: 10px;
    border-radius: 6px;
    font-family: Arial;
    font-size: 14px;
    z-index: 9999;
    display: none;
"></div>

<!-- CLOCK -->
<div id="clock" style="
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,0.8);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: Arial;
    z-index: 9999;
"></div>

<script src="./resources/ol.js"></script>
<script src="./layers/layers.js"></script>
<script src="./resources/qgis2web.js"></script>

<script>
/* ---------------- CLOCK ---------------- */
function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerHTML =
        now.toLocaleTimeString();
}
updateClock();
setInterval(updateClock, 1000);

/* ---------------- HOVER HIGHLIGHT ---------------- */

const infoBox = document.getElementById('country-info');

const highlightStyle = new ol.style.Style({
    stroke: new ol.style.Stroke({
        color: '#ffff00',
        width: 3
    }),
    fill: new ol.style.Fill({
        color: 'rgba(255,255,0,0.2)'
    })
});

let lastFeature = null;
let originalStyle = null;

map.on('pointermove', function (evt) {

    if (lastFeature) {
        lastFeature.setStyle(originalStyle);
        lastFeature = null;
    }

    const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);

    if (feature) {

        lastFeature = feature;
        originalStyle = feature.getStyle();

        feature.setStyle(highlightStyle);

        const geom = feature.getGeometry().getType();

        let label = "Unknown feature";

        if (geom.includes("Polygon")) {
            label = "Land / Country area";
        } else if (geom.includes("LineString")) {
            label = "Border / Coastline / Water boundary";
        }

        infoBox.innerHTML = `
            <b>${label}</b><br>
            Type: ${geom}
        `;

        infoBox.style.display = "block";
        map.getTargetElement().style.cursor = "pointer";

    } else {
        infoBox.style.display = "none";
        map.getTargetElement().style.cursor = "";
    }
});

</script>

</body>
</html>
